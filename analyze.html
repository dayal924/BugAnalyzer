<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BugAnalyzer - Analyze Code">
    <title>BugAnalyzer — Analyze Code</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐛%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-200 font-sans antialiased transition-colors duration-300">

<nav class="w-full z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                    <i data-feather="shield" class="w-5 h-5 text-white"></i>
                </div>
                <a href="index.html" class="font-bold text-xl tracking-tight dark:text-white">BugAnalyzer</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-sm font-medium hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Back</a>
            </div>
        </div>
    </div>
</nav>

<main class="pt-20 pb-24">
    <div class="max-w-5xl mx-auto px-4 sm:px-6">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold dark:text-white">Analyze Your Code</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2">Upload files or paste code to run the local prediction agent.</p>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row justify-between items-center bg-slate-50 dark:bg-slate-950/80 gap-4">
                <div class="flex items-center gap-4 w-full sm:w-auto">
                    <div class="flex gap-2">
                        <div class="w-3 h-3 rounded-full bg-red-400"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                        <div class="w-3 h-3 rounded-full bg-green-400"></div>
                    </div>
                    <div class="h-6 w-px bg-slate-300 dark:bg-slate-700 mx-2"></div>
                    <label for="language-select" class="sr-only">Select Language</label>
                    <select id="language-select" class="bg-transparent text-sm font-medium text-slate-600 dark:text-slate-300 focus:outline-none cursor-pointer">
                        <option value="auto">Auto-detect Language</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="javascript">JavaScript</option>
                        <option value="cpp">C/C++</option>
                    </select>
                </div>

                <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                    <button type="button" id="upload-btn" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-colors">
                        <i data-feather="upload-cloud" class="w-3.5 h-3.5"></i> Upload File
                    </button>
                    <input type="file" id="file-input" class="hidden" aria-label="Upload Code File" title="Upload Code File">
                </div>
            </div>

            <div class="relative flex bg-slate-50 dark:bg-slate-950/50 font-mono text-sm">
                <div id="line-numbers" class="w-12 pt-8 pr-3 text-right text-slate-400 dark:text-slate-600 border-r border-slate-200 dark:border-slate-800 select-none overflow-y-auto bg-slate-100 dark:bg-slate-900/30 leading-relaxed">
                    1
                </div>

                <textarea id="code-input" class="w-full h-[560px] p-8 pl-4 bg-transparent resize-none focus:outline-none dark:text-slate-300 placeholder-slate-400 leading-relaxed whitespace-pre" spellcheck="false" placeholder="Paste your source code here..."></textarea>
            </div>

            <div class="p-6 bg-slate-50 dark:bg-slate-900/80 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                <button type="button" id="analyze-btn" class="group flex items-center gap-2 px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-500/20 active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed">
                    <i data-feather="search" class="w-4 h-4 group-hover:rotate-90 transition-transform"></i>
                    <span id="analyze-text">Run Prediction Agent</span>
                    <div id="analyze-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                </button>
            </div>
        </div>

        <div id="results-section" class="hidden mt-12">
            <div class="flex flex-col md:flex-row gap-8">
                <div class="flex-1 space-y-6">
                    <div id="risk-banner" class="p-8 rounded-2xl border transition-all duration-500">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div class="flex items-center gap-6">
                                <div id="risk-icon" class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-inner transition-colors"></div>
                                <div>
                                    <p class="text-xs font-bold uppercase tracking-widest opacity-60">Bug Probability</p>
                                    <h3 id="risk-level" class="text-3xl font-black italic tracking-tight">--</h3>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-xs opacity-60 mb-1">Confidence Score</p>
                                <p id="risk-percentage" class="text-5xl font-black tracking-tighter">0%</p>
                            </div>
                        </div>
                        <div class="mt-6 h-2 w-full bg-slate-900/10 dark:bg-white/10 rounded-full overflow-hidden">
                            <div id="risk-progress" class="h-full rounded-full transition-all duration-1000 w-0"></div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6">
                        <h4 class="font-bold text-sm uppercase tracking-wider mb-6 opacity-60 flex items-center gap-2">
                            <i data-feather="list" class="w-4 h-4"></i> Detected Patterns
                        </h4>
                        <div id="issues-list" class="space-y-4"></div>
                    </div>
                </div>

                <div class="w-full md:w-80 space-y-6">
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 sticky top-8">
                        <h4 class="font-bold text-sm uppercase tracking-wider mb-6 opacity-60">Code Metrics</h4>
                        <div class="space-y-6">
                            <div class="flex items-center justify-between p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                                <div class="flex items-center gap-3">
                                    <div class="p-2 bg-indigo-500/10 rounded-lg"><i data-feather="file-text" class="w-4 h-4 text-indigo-500"></i></div>
                                    <span class="text-sm font-medium">Lines</span>
                                </div>
                                <span id="metric-loc" class="text-lg font-bold">0</span>
                            </div>
                            <div class="flex items-center justify-between p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                                <div class="flex items-center gap-3">
                                    <div class="p-2 bg-purple-500/10 rounded-lg"><i data-feather="repeat" class="w-4 h-4 text-purple-500"></i></div>
                                    <span class="text-sm font-medium">Loops</span>
                                </div>
                                <span id="metric-loops" class="text-lg font-bold">0</span>
                            </div>
                            <div class="flex items-center justify-between p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                                <div class="flex items-center gap-3">
                                    <div class="p-2 bg-pink-500/10 rounded-lg"><i data-feather="git-branch" class="w-4 h-4 text-pink-500"></i></div>
                                    <span class="text-sm font-medium">Complexity</span>
                                </div>
                                <span id="metric-complexity" class="text-lg font-bold">0</span>
                            </div>
                        </div>

                        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
                            <p class="text-xs text-slate-400">Analysis performed by local Rule Engine</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
<script>
    // Initialize icons
    feather.replace();
</script>
</body>
</html>
